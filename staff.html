<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laundry Desk | LNMIIT</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .staff-page{min-height:100vh;background:#14281f}.staff-page .nav{background:#f5f1e8;max-width:none;padding-left:max(32px,calc((100vw - 1116px)/2));padding-right:max(32px,calc((100vw - 1116px)/2))}.desk{min-height:calc(100vh - 94px);display:grid;place-items:center;padding-top:50px;padding-bottom:75px}.desk-card{width:min(100%,490px);background:#f5f1e8;border-radius:12px;padding:42px;box-shadow:10px 11px 0 #d7fa52}.desk-card h1{font-size:39px;letter-spacing:-2px;line-height:1;margin:0 0 10px}.desk-help{font-size:14px;line-height:1.55;color:#637067;margin:0 0 27px}.desk-card label{display:block;font-size:12px;font-weight:800;margin-top:16px}.desk-card input:not(.number-input){display:block;width:100%;border:1px solid #d3d8d3;background:#fff;margin-top:7px;border-radius:5px;padding:14px 12px;font:15px Manrope;color:#14281f;outline-color:#789f23}.desk-card button:not(#signOut){width:100%;border:0;border-radius:5px;background:#14281f;color:white;font:800 16px Manrope;padding:16px;margin-top:19px;cursor:pointer}.desk-card button:disabled{opacity:.6}.desk-topline{display:flex;justify-content:space-between;align-items:start}.desk-topline #signOut{border:0;background:transparent;text-decoration:underline;color:#637067;font:600 12px Manrope;cursor:pointer}.number-label{color:#506156;letter-spacing:.5px}.number-input{display:block;width:100%;margin-top:8px;background:#fff;border:2px solid #14281f;border-radius:6px;padding:11px 15px;font:700 76px "DM Mono",monospace;line-height:1;letter-spacing:-6px;color:#14281f;outline-color:#d7fa52}.update-button{background:#d7fa52!important;color:#14281f!important}.update-message{min-height:16px;margin:12px 0 0;text-align:center;font-size:12px;font-weight:700}@media(max-width:700px){.staff-page .nav{padding-left:21px;padding-right:21px}.desk{min-height:calc(100vh - 75px);padding:27px 21px}.desk-card{padding:30px 24px;box-shadow:6px 7px 0 #d7fa52}.desk-card h1{font-size:34px}.number-input{font-size:62px}}
    </style>
  </head>
  <body class="staff-page">
    <nav class="nav wrap">
      <a class="brand" href="index.html"><span class="brand-mark">L</span><span>LNMIIT <b>Campus</b></span></a>
      <a class="staff-link" href="index.html">View board <span>↗</span></a>
    </nav>
    <main class="desk wrap">
      <section class="desk-card" id="loginPanel">
        <p class="section-kicker">LAUNDRY DESK</p>
        <h1>Sign in</h1>
        <p class="desk-help">Use the laundry staff email and password.</p>
        <form id="loginForm">
          <label>Staff email<input id="staffEmail" type="email" placeholder="you@lnmiit.ac.in" required autocomplete="username" /></label>
          <label>Password<input id="staffPassword" type="password" placeholder="Password" required autocomplete="current-password" /></label>
          <p class="form-message" id="loginMessage"></p>
          <button type="submit">Sign in</button>
        </form>
      </section>
      <section class="desk-card hidden" id="updatePanel">
        <div class="desk-topline"><p class="section-kicker">LAUNDRY DESK</p><button id="signOut" type="button">Sign out</button></div>
        <h1>What token is ready?</h1>
        <p class="desk-help">Enter the latest number, then press update.</p>
        <form id="updateForm">
          <label class="number-label" for="newNumber">Ready through token</label>
          <input id="newNumber" class="number-input" type="number" min="0" inputmode="numeric" required autofocus />
          <button class="update-button" type="submit">Update live board</button>
          <p class="form-message update-message" id="updateMessage"></p>
        </form>
      </section>
    </main>
    <script type="module" src="staff.js"></script>
  </body>
</html>
